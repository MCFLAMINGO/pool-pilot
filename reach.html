<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Reach (ops) — Pool Pilot</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/bd.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="logo" href="/" style="text-decoration:none;color:inherit">
      <img src="logo.png" alt="Pool Pilot" width="36" height="36">
      <div>
        <h1>Pool Pilot</h1>
        <span class="sub">Ops · reach</span>
      </div>
    </a>
  </header>

  <section class="card" data-testid="card-reach-gate">
    <p class="bd-kicker">Private</p>
    <h2>Natural reach vs partners</h2>
    <p class="bd-lead">Invisible house ref <span class="mono">poolpilot</span> — cold traffic with no partner link. Not on the public Live field. Bookmark with your key; never share this URL.</p>
    <div class="bd-form">
      <label style="grid-column:1/-1">Ops key
        <input id="opsKey" type="password" autocomplete="off" spellcheck="false" placeholder="HOUSE_VIEW_KEY" data-testid="input-ops-key">
      </label>
    </div>
    <div class="bd-actions">
      <button type="button" class="btn btn-primary" id="loadBtn" data-testid="button-reach-load">Load</button>
      <button type="button" class="btn btn-ghost" id="clearBtn" data-testid="button-reach-clear">Clear key</button>
    </div>
    <div id="errBanner" class="banner err hidden" data-testid="reach-error"></div>
  </section>

  <section class="card hidden" id="reportCard" data-testid="card-reach-report">
    <h3>Split</h3>
    <div class="seat-pay" style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)">
      <div class="bd-stat"><div class="n" id="natVol">—</div><div class="l">Natural (house)</div></div>
      <div class="bd-stat"><div class="n" id="partVol">—</div><div class="l">Partners</div></div>
      <div class="bd-stat"><div class="n" id="natShare">—</div><div class="l">Natural share</div></div>
    </div>
    <p class="bd-lead mono" id="mtdLine" style="margin-top:var(--space-3)"></p>
    <p class="bd-lead" id="houseNote"></p>

    <h3 style="margin-top:var(--space-4)">Partner refs</h3>
    <div id="partnerList" class="seat-board" data-testid="reach-partner-list">—</div>
  </section>
</div>
<script src="js/partnerLib.js"></script>
<script src="js/reach.js"></script>
</body>
</html>
