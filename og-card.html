<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; position: relative;
    background: #faf7f5;
    display: flex; align-items: center;
    font-family: 'Satoshi', sans-serif; color: #231c1a;
  }
  /* subtle depth-bar motif on the right edge */
  .bars { position: absolute; right: 0; top: 0; bottom: 0; width: 340px; overflow: hidden; }
  .bars div { position: absolute; right: -40px; height: 46px; border-radius: 10px 0 0 10px; background: #fbe3ec; }
  .bars .b1 { width: 150px; top: 88px; }
  .bars .b2 { width: 220px; top: 152px; }
  .bars .b3 { width: 290px; top: 216px; }
  .bars .b4 { width: 360px; top: 280px; background: #f7cdde; }
  .bars .b5 { width: 290px; top: 344px; }
  .bars .b6 { width: 220px; top: 408px; }
  .bars .b7 { width: 150px; top: 472px; }
  .content { padding-left: 84px; position: relative; z-index: 2; display: flex; align-items: center; gap: 64px; }
  .mark img { width: 300px; height: 300px; display: block; }
  h1 { font-size: 104px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
  .tag { margin-top: 22px; font-size: 34px; font-weight: 500; color: #756a66; max-width: 560px; line-height: 1.3; }
  .chips { margin-top: 34px; display: flex; gap: 14px; }
  .chip {
    font-family: 'JetBrains Mono', monospace; font-size: 21px; font-weight: 600;
    padding: 10px 22px; border-radius: 999px; background: #ffffff;
    border: 2px solid #e4dcd7; color: #756a66;
  }
  .chip.pink { background: #e0447c; border-color: #e0447c; color: #ffffff; }
</style>
</head>
<body>
  <div class="card">
    <div class="bars"><div class="b1"></div><div class="b2"></div><div class="b3"></div><div class="b4"></div><div class="b5"></div><div class="b6"></div><div class="b7"></div></div>
    <div class="content">
      <div class="mark"><img src="logo.png"></div>
      <div>
        <h1>Pool Pilot</h1>
        <div class="tag">Your pool's health in plain English. Fix it in one signed move.</div>
        <div class="chips">
          <span class="chip pink">poolpilot.xyz</span>
          <span class="chip">Robinhood Chain</span>
          <span class="chip">non-custodial</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
