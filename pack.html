<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src https://fonts.gstatic.com https://cdn.fontshare.com data:; img-src 'self' data: https://api.qrserver.com; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Partner pack — Pool Pilot</title>
<meta name="description" content="Generate Arrive, swap, Telegram, and embed links for your Robinhood Chain token community.">
<meta property="og:title" content="Partner pack — Pool Pilot">
<meta property="og:description" content="Install Pool Pilot as your community’s Robinhood trading route in one kit.">
<meta property="og:url" content="https://poolpilot.xyz/pack">
<meta property="og:image" content="https://poolpilot.xyz/og-swap.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://poolpilot.xyz/pack">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/bd.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="logo" href="/" style="text-decoration:none;color:inherit">
      <img src="logo.png" alt="Pool Pilot" width="36" height="36">
      <div>
        <h1>Pool Pilot</h1>
        <span class="sub">Partner pack</span>
      </div>
    </a>
    <div class="spacer"></div>
    <a class="btn btn-ghost" href="/seat" data-testid="link-pack-seat">Seat</a>
    <a class="btn btn-ghost" href="/partner" data-testid="link-pack-partner">Stats</a>
    <a class="btn btn-ghost" href="/press" data-testid="link-pack-press">Press</a>
  </header>

  <section class="card" data-testid="card-pack">
    <h2>Partner pack</h2>
    <p class="bd-lead">Paste your token. Get Arrive, swap, Telegram, embed, and QR — ready for website, TG, X, and launch guides.</p>

    <div class="bd-form">
      <label>Ticker <input id="sym" placeholder="MCFL" data-testid="input-pack-symbol"></label>
      <label>Token address <input id="token" placeholder="0x…" spellcheck="false" data-testid="input-pack-token"></label>
      <label>Default $ <input id="usd" value="25" inputmode="decimal" data-testid="input-pack-usd"></label>
      <label>Partner ref <input id="ref" placeholder="yourcommunity" data-testid="input-pack-ref"></label>
    </div>
    <div class="bd-actions">
      <button type="button" class="btn btn-primary" id="genBtn" data-testid="button-pack-gen">Generate pack</button>
      <button type="button" class="btn btn-ghost" id="copyAllBtn" data-testid="button-pack-copy-all">Copy all links</button>
    </div>

    <div id="packOut" class="bd-out hidden" data-testid="pack-out">
      <div class="bd-qr-row">
        <img id="qrImg" alt="QR to Arrive" width="160" height="160" data-testid="img-pack-qr">
        <div>
          <p class="bd-kicker">Scan → Arrive</p>
          <p id="qrUrl" class="mono bd-url" data-testid="text-pack-qr-url"></p>
        </div>
      </div>
      <div class="bd-links" id="linkList"></div>
      <h3>Copy for TG / X / site</h3>
      <textarea id="copyBox" class="bd-textarea" readonly rows="8" data-testid="textarea-pack-copy"></textarea>
      <div class="bd-actions">
        <button type="button" class="btn btn-primary" id="copyTextBtn" data-testid="button-pack-copy-text">Copy text</button>
        <a class="btn btn-ghost" id="caseLink" href="/case" data-testid="link-pack-case">Open case study page</a>
        <a class="btn btn-ghost" id="partnerLink" href="/partner" data-testid="link-pack-stats">Partner stats</a>
      </div>
      <h3>Embed snippet</h3>
      <textarea id="embedBox" class="bd-textarea" readonly rows="3" data-testid="textarea-pack-embed"></textarea>
    </div>
  </section>
</div>
<script src="js/partnerLib.js"></script>
<script src="js/pack.js"></script>
</body>
</html>
